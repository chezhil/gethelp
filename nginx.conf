# Cloud Run hands the container a port in $PORT and expects it to listen there.
server {
  listen       ${PORT};
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # Hashed bundles and assets can be cached hard; index.html must not be, or
  # a deploy takes hours to reach anyone who has already visited.
  location /_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Single-page app: every route is served by index.html, so a refresh on
  # /result or a shared /settings link doesn't 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
